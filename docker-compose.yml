services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - bot-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bot-data:
